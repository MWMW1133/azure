spring.application.name=azure

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
server.port=8080

# Agora
agora.app-id=${AGORA_APP_ID}
agora.app-certificate=${AGORA_APP_CERT}
agora.customer-id=${AGORA_CUSTOMER_ID}
agora.customer-secret=${AGORA_CUSTOMER_SECRET}
agora.token-ttl-seconds=3600

agora.bucket.vendor=${AGORA_BUCKET_VENDOR}
agora.bucket.region=${AGORA_BUCKET_REGION}
agora.bucket.bucket=${AGORA_BUCKET_BUCKET}
agora.bucket.access-key=${AGORA_BUCKET_ACCESS_KEY}
agora.bucket.secret-key=${AGORA_BUCKET_SECRET_KEY}
agora.bucket.file-prefix=${AGORA_BUCKET_FILE_PREFIX}
agora.public-base-url=${AGORA_PUBLIC_BASE_URL:}

# Clova
clova.client-id=${CLOVA_CLIENT_ID}
clova.client-secret=${CLOVA_CLIENT_SECRET}
clova.speech-url=${CLOVA_SPEECH_URL}
clova.callback-url=${CLOVA_CALLBACK_URL}

spring.datasource.url=jdbc:mysql://113.198.238.119:3308/azure?serverTimezone=Asia/Seoul
spring.datasource.username=azure
spring.datasource.password=1234

# spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false



documents.retain-versions=3


spring.task.scheduling.pool.size=2
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.main.allow-bean-definition-overriding=true

storage.base-dir=/var/azure/uploads
