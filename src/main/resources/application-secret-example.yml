# src/main/resources/application-secret.yml
agora:
  app-id: ""
  app-certificate: ""  # 서버에서만 사용(프론트 전송 금지)
  customer-id: "AGORA_RESTFUL_CUSTOMER_ID"                  # Cloud Recording REST BasicAuth ID
  customer-secret: "AGORA_RESTFUL_CUSTOMER_SECRET"          # Cloud Recording REST BasicAuth PW
  public-base-url: "https://your-bucket.s3.ap-northeast-2.amazonaws.com"  # 업로드된 파일 접근 베이스 URL
  bucket:
    vendor: 1                           # AWS=1 (Agora 규격)
    region: "ap-northeast-2"
    bucket: "your-recording-bucket"
    access-key: "AWS_ACCESS_KEY"
    secret-key: "AWS_SECRET_KEY"
    file-prefix: "recordings/event-{eventId}"  # {eventId} 그대로 두세요

clova:
  endpoint: "https://clovaspeech-gw.ncloud.com/external/v1/long"
  key-id: ""
  key-secret: ""
  callback-url: "https://YOUR-DOMAIN/api/transcripts/callback" # 외부에서 들어올 수 있는 공개 URL
